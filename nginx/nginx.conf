worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # ADR-003 D3 — strip Authorization from every proxied request (dev + prod)
        proxy_set_header Authorization "";

        # Strapi REST API
        location /api/ {
            proxy_pass         http://cms:1337/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # Angular dev server (host=localhost so ng serve accepts the request)
        # WebSocket headers enable HMR live-reload
        location / {
            proxy_pass         http://web:4201/;
            proxy_set_header   Host              localhost;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
